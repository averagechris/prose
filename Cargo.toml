[package]
name = "prose"
version = "0.1.1"
edition = "2024"
description = "Voice-preserving authoring service for agent-assisted content: deterministic voice packs, drafts, verbs, and approval attestations."
authors = ["Christopher Cummings"]
license = "MIT OR Apache-2.0"
repository = "https://git.sr.ht/~averagechris/prose"
homepage = "https://git.sr.ht/~averagechris/prose"
readme = "README.md"
categories = ["command-line-utilities"]

[[bin]]
name = "prose"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
opt-level = "s"
panic = "abort"
